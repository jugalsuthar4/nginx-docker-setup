version: '3'
services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - node-backend
      - python-backend
  
  node-backend:
    build: ./node-server
  
  python-backend:
    build: ./python-server
